name: Harvest

# The heartbeat. Every Monday a runner goes out, reads what the venues publish,
# and commits the corpus. Nothing else in this repository can add an event.
#
# workflow_dispatch only works from the default branch, so while this lives on a
# feature branch it is driven by pushing: touch .github/harvest-args (which also
# carries the CLI arguments) and the run starts.

on:
  schedule:
    # 05:20 UTC Monday. Not on the hour, because everyone schedules on the hour.
    - cron: '20 5 * * 1'
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths:
      # Exactly one file, deliberately. A crawl takes tens of minutes, and
      # every broader path filter I tried ended with an ordinary push killing a
      # run that was 30 minutes into enrichment. Touch this file to run it.
      - '.github/harvest-args'

permissions:
  contents: write

concurrency:
  group: harvest-${{ github.ref }}
  # NOT cancel-in-progress. A harvest takes 10-40 minutes and any push that
  # touches pipeline/ re-triggers it, so cancelling the running one meant three
  # consecutive full crawls were killed at the enrichment step and the corpus
  # never gained its artist index. Queue instead.
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Read run arguments
        id: args
        run: |
          ARGS="$(cat .github/harvest-args 2>/dev/null | grep -v '^#' | tr '\n' ' ' | xargs || true)"
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"
          echo "running with: $ARGS"

      - name: Harvest
        run: node pipeline/harvest.mjs ${{ steps.args.outputs.args }}

      - name: Enrich artists
        id: enrich
        if: hashFiles('pipeline/enrich.mjs') != ''
        # continue-on-error, but not the way it was used before.
        #
        # It was once set here in the plain sense and masked a total failure as a
        # green step: the artist index was empty for four consecutive runs and
        # every one reported success. The fix was to let the step fail, which
        # held until 2026-08-24, when MusicBrainz did not answer, the probe
        # correctly exited 4, and Validate, Build and Commit were all skipped —
        # so a complete crawl of 1867 events from 18/18 sources, with 0 errors
        # across 3022 requests, was thrown away because a third-party lookup
        # service was unreachable for an hour.
        #
        # Both failures came from tying two independent things together. The
        # corpus is the product; the artist index makes it smarter and is cached
        # for 90 days. So the run now continues and commits the corpus, and the
        # LAST step fails the job. The corpus survives, the failure stays red,
        # and the commit message says the index was not refreshed.
        continue-on-error: true
        env:
          # Bounded so one run cannot spend an hour on MusicBrainz. The cache is
          # incremental, so successive weeks finish the tail.
          ENRICH_LIMIT: '900'
        run: node pipeline/enrich.mjs

      - name: Validate
        if: hashFiles('pipeline/validate.mjs') != ''
        run: node pipeline/validate.mjs

      - name: Build site
        if: hashFiles('pipeline/build.mjs') != ''
        run: node pipeline/build.mjs

      # A failed push must not throw away a 40-minute crawl and the artist
      # enrichment behind it. It already did once.
      - name: Keep the corpus even if the commit fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus
          path: |
            data/
            docs/index.html
          retention-days: 14

      - name: Commit corpus
        env:
          ENRICH_OUTCOME: ${{ steps.enrich.outcome }}
        run: |
          git config user.name  "concert-finder-harvest"
          git config user.email "noreply@github.com"
          git add -A data/ docs/ recon/ || true
          # Anyone reading git log should be able to see that a commit carries a
          # fresh calendar but last week's artist index.
          NOTE=""
          if [ "$ENRICH_OUTCOME" = "failure" ]; then
            NOTE=" [artist index NOT refreshed: enrichment failed]"
          fi
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "harvest: $(node -e "const m=require('./data/harvest-meta.json');console.log(m.counts.events+' events from '+m.counts.sourcesWithEvents+' sources, '+m.generatedAt.slice(0,10))")$NOTE"
            for i in 1 2 3; do
              git pull --rebase -q origin ${{ github.ref_name }} || true
              git push origin HEAD:${{ github.ref_name }} && break
              sleep $((i * 5))
            done
          fi

      - name: Report
        if: always()
        run: |
          node -e "
          const m=require('./data/harvest-meta.json');
          console.log('## Harvest '+m.generatedAt);
          console.log('');
          console.log('| source | kept | fetched | top reject |');
          console.log('|---|---|---|---|');
          for(const s of m.perSource.sort((a,b)=>b.kept-a.kept)){
            const r=Object.entries(s.rejects).sort((a,b)=>b[1]-a[1])[0];
            console.log('| '+s.id+' | '+s.kept+' | '+s.fetched+' | '+(r?r[0]+':'+r[1]:'')+' |');
          }
          " >> $GITHUB_STEP_SUMMARY

      # The whole point of letting the run continue: the job must still go red,
      # or this is the silent-green failure all over again.
      - name: Fail the run if enrichment did not work
        if: always() && steps.enrich.outcome == 'failure'
        run: |
          echo "Enrichment failed. The corpus was harvested and committed anyway;"
          echo "the artist index is whatever the last good run left behind, so"
          echo "artists new this week are missing from it until this succeeds."
          echo "The cause is in the 'Enrich artists' step above."
          exit 1
